# Isolated/backend service for Saddle & Stone.
# The localhost port remains available for private health checks.
# The external saddle-stone-net attachment allows the existing Caddy container
# to proxy ONLY /owner, /api and /uploads when we deliberately enable those routes.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saddle-stone-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend-data:/data
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - saddle-stone-net

networks:
  saddle-stone-net:
    external: true
    name: saddle-stone-net
